<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>أداة الإدارة الآلية الذكية</title>
    <!-- استيراد خط Cairo العصري فائق الدقة -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root[data-theme="light"] {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --success: #10b981;
            --success-hover: #059669;
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #cbd5e1;
            --input-bg: #ffffff;
            --row-bg: #f8fafc;
            --log-bg: #0f172a;
            --log-text: #38bdf8;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
        }

        :root[data-theme="dark"] {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --danger: #f87171;
            --danger-hover: #ef4444;
            --success: #34d399;
            --success-hover: #10b981;
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --input-bg: #0f172a;
            --row-bg: #0f172a;
            --log-bg: #090d16;
            --log-text: #38bdf8;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .container {
            width: 100%;
            max-width: 850px;
            background: var(--card-bg);
            padding: 30px 25px;
            border-radius: 16px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
            position: relative;
            box-sizing: border-box;
        }

        .theme-toggle {
            position: absolute;
            top: 25px;
            left: 25px;
            background: var(--row-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            transition: all 0.2s;
        }

        .theme-toggle:hover {
            transform: scale(1.05);
            border-color: var(--primary);
        }

        h2 {
            text-align: center;
            color: var(--text-main);
            font-weight: 700;
            margin-top: 10px;
            margin-bottom: 5px;
            font-size: 1.4rem;
            padding-left: 40px;
            padding-right: 40px;
        }

        .platform-subtitle {
            text-align: center;
            font-size: 0.95rem;
            color: var(--primary);
            margin-bottom: 4px;
            font-weight: 700;
        }

        .platform-phone-header {
            text-align: center;
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 25px;
            font-weight: 600;
        }

        h2::after {
            content: '';
            display: block;
            width: 50px;
            height: 3px;
            background-color: var(--primary);
            margin: 8px auto 0;
            border-radius: 2px;
        }

        .tabs-header {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 12px;
        }

        .tab-btn {
            background: var(--row-bg);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 8px 14px;
            border-radius: 10px;
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
            font-weight: 600;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
        }

        .tab-btn .close-tab {
            background: rgba(0,0,0,0.15);
            border-radius: 50%;
            width: 16px;
            height: 16px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            cursor: pointer;
        }

        .btn-add-tab {
            background: transparent;
            color: var(--primary);
            border: 2px dashed var(--primary);
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: var(--text-main);
            font-size: 0.9rem;
        }

        textarea, select, input[type="text"], input[type="number"], input[type="password"] {
            width: 100%;
            padding: 11px 14px;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
            font-size: 0.9rem;
            color: var(--text-main);
            background-color: var(--input-bg);
            transition: all 0.3s ease;
        }

        textarea:focus, select:focus, input[type="text"]:focus, input[type="number"]:focus, input[type="password"]:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.15);
        }

        textarea {
            height: 100px;
            resize: vertical;
        }

        .row-grid {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .row-grid .form-group {
            flex: 1;
            min-width: 200px;
        }

        #accountsContainer {
            max-height: 220px;
            overflow-y: auto;
            padding: 6px;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            background: var(--row-bg);
            margin-bottom: 6px;
        }

        .account-row {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
            align-items: center;
        }

        .account-row input {
            flex: 1;
            min-width: 0;
        }

        .btn-remove {
            background-color: var(--danger);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 0 12px;
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
            font-weight: 600;
            height: 42px;
            font-size: 0.85rem;
            flex-shrink: 0;
        }

        .account-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 5px;
            flex-wrap: wrap;
            gap: 5px;
        }

        .accounts-count {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        .btn-secondary {
            background-color: var(--success);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 7px 14px;
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
            font-weight: 600;
            font-size: 0.85rem;
            box-shadow: 0 4px 10px rgba(16, 185, 129, 0.2);
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 25px;
            flex-wrap: wrap;
        }

        button.main-btn {
            background-color: var(--primary);
            color: white;
            padding: 12px 18px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.95rem;
            font-family: 'Cairo', sans-serif;
            font-weight: 600;
            flex: 1;
            min-width: 140px;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
            transition: background 0.2s;
        }

        button.main-btn:hover {
            background-color: var(--primary-hover);
        }

        .btn-danger-action {
            background-color: var(--danger);
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3);
        }

        #log {
            margin-top: 20px;
            background: var(--log-bg);
            color: var(--log-text);
            padding: 12px;
            border-radius: 10px;
            max-height: 140px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 0.8rem;
            line-height: 1.4;
            border: 1px solid var(--border-color);
            word-break: break-all;
        }

        .saved-notice {
            font-size: 0.8rem;
            color: var(--success);
            margin-top: 5px;
            font-weight: 600;
        }

        .cloud-section {
            background: var(--row-bg);
            border: 1px dashed var(--primary);
            padding: 15px;
            border-radius: 12px;
            margin-top: 20px;
        }

        .whatsapp-section {
            background: rgba(16, 185, 129, 0.05);
            border: 1px solid var(--success);
            padding: 15px;
            border-radius: 12px;
            margin-top: 20px;
        }

        .answer-option-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 10px;
            background: var(--input-bg);
            padding: 10px 14px;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            width: 100%;
            box-sizing: border-box;
        }

        .answer-option-row input[type="radio"], 
        .answer-option-row input[type="checkbox"] {
            width: 22px;
            height: 22px;
            cursor: pointer;
            accent-color: var(--primary);
            flex-shrink: 0;
            margin: 0;
        }

        .answer-option-row label {
            flex: 1;
            margin: 0;
            font-weight: 500;
            cursor: pointer;
            word-break: break-word;
        }

        .answer-option-row input[type="text"] {
            flex: 1;
            border: none;
            background: transparent;
            padding: 4px;
            box-shadow: none;
            margin: 0;
        }

        .answer-option-row input[type="text"]:focus {
            box-shadow: none;
        }

        .student-exam-box {
            background: var(--row-bg);
            border: 2px solid var(--primary);
            padding: 20px;
            border-radius: 14px;
            margin-top: 20px;
            text-align: center;
        }
        .mandatory-submit-btn {
            background-color: var(--success);
            color: white;
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
            margin-top: 15px;
            font-family: 'Cairo', sans-serif;
        }
        .mandatory-submit-btn:hover {
            background-color: var(--success-hover);
        }

        .return-back-btn {
            background-color: #64748b;
            color: white;
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: not-allowed;
            margin-top: 10px;
            opacity: 0.6;
            font-family: 'Cairo', sans-serif;
            pointer-events: none;
        }

        .result-box {
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            font-weight: 700;
            display: none;
        }
        .retry-btn {
            background-color: #d97706;
            color: white;
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
            display: none;
            font-family: 'Cairo', sans-serif;
        }
        .retry-btn:hover {
            background-color: #b45309;
        }

        @media (max-width: 576px) {
            body { padding: 10px 5px; }
            .container { padding: 20px 15px; }
            .account-row { flex-direction: column; align-items: stretch; }
            .btn-remove { width: 100%; height: 35px; }
            .btn-group { flex-direction: column; }
            button.main-btn { width: 100%; }
            .answer-option-row { padding: 8px 10px; gap: 8px; }
        }
    </style>
</head>
<body>

<div class="container">
    <button class="theme-toggle" id="themeToggleBtn" onclick="toggleTheme()" title="تبديل الوضع"></button>

    <h2>أستاذ أحمد مصطفى ✒️</h2>
    <div class="platform-subtitle">مدرس اللغة العربية 📚</div>
    <div class="platform-phone-header">الهاتف: <span dir="ltr" style="display:inline-block;">01095676982</span></div>
    
    <div class="tabs-header" id="tabsHeader"></div>

    <div class="form-group">
        <label for="targetUrl">رابط الموقع أو المنشور المستهدف:</label>
        <input type="text" id="targetUrl" placeholder="https://example.com/post">
        <div class="saved-notice" id="noticeMsg"></div>
    </div>

    <div class="whatsapp-section">
        <label style="color: var(--success); margin-bottom: 8px;">💬 فتح محادثة WhatsApp مباشرة (بدون حفظ الرقم):</label>
        <div class="row-grid">
            <div class="form-group" style="margin-bottom: 0;">
                <input type="text" id="waPhoneNumber" placeholder="أدخل الرقم بكود الدولة (مثلاً: 201095676982)">
            </div>
            <div class="form-group" style="margin-bottom: 0;">
                <input type="text" id="waMessageText" placeholder="رسالة افتراضية (اختياري)...">
            </div>
        </div>
        <button class="main-btn btn-secondary" type="button" style="width: 100%; margin-top: 10px;" onclick="openWhatsAppChat()">فتح شات الواتساب الآن</button>
    </div>

    <div class="row-grid" style="margin-top: 18px;">
        <div class="form-group">
            <label for="reactionType">نوع التفاعل المطلوب:</label>
            <select id="reactionType">
                <option value="like">إعجاب / لايك (Like)</option>
                <option value="love">أعجبني / حب (Love)</option>
                <option value="care">أهتم به (Care)</option>
                <option value="haha">مضحك (Haha)</option>
                <option value="wow">واو (Wow)</option>
                <option value="sad">حزين (Sad)</option>
                <option value="angry">غاضب (Angry)</option>
            </select>
        </div>

        <div class="form-group">
            <label for="likesCount">عدد اللايكات/التفاعلات المستهدفة:</label>
            <input type="number" id="likesCount" value="1" min="1">
        </div>
    </div>

    <div class="form-group">
        <label>حسابات هذا التبويب (البريد الإلكتروني / اسم المستخدم وكلمة السر):</label>
        <div id="accountsContainer"></div>
        <div class="account-footer">
            <span class="accounts-count" id="accountsCount">عدد الحسابات: 0</span>
            <button type="button" class="btn-secondary" onclick="addAccountRow('', '')">+ إضافة حساب جديد</button>
        </div>
    </div>

    <div class="form-group">
        <label for="commentsList">التعليقات المطلوبة (كل سطر تعليق مستقل):</label>
        <textarea id="commentsList" placeholder="التعليق الأول&#10;التعليق الثاني"></textarea>
    </div>

    <div class="form-group">
        <label>خيارات الإجابات (خانة الاختيار بجانب الإجابة مباشرة متجاوبة للموبايل):</label>
        <div id="answersOptionsContainer">
            <div class="answer-option-row">
                <input type="radio" name="examChoice" id="choice1" checked>
                <label for="choice1"><input type="text" value="الإجابة الأولى (صحيحة)"></label>
            </div>
            <div class="answer-option-row">
                <input type="radio" name="examChoice" id="choice2">
                <label for="choice2"><input type="text" value="الإجابة الثانية (خاطئة)"></label>
            </div>
        </div>
    </div>

    <div class="student-exam-box">
        <label style="color: var(--primary); font-size: 1rem; margin-bottom: 5px;">📝 نظام الامتحان الذكي والتصحيح الآلي للطلاب:</label>
        <p style="font-size: 0.85rem; color: var(--danger); font-weight: 600; margin-top: 0;">⚠️ ممنوع الخروج من الصفحة أو التراجع حتى يتم إرسال وتسليم إجاباتك.</p>
        
        <button type="button" class="mandatory-submit-btn" id="submitExamBtn" onclick="submitStudentMandatoryExam()">تسليم الإجابات النهائية للواجب</button>
        
        <button type="button" class="return-back-btn" id="returnBackBtn" title="زر العودة معطل أثناء الحل لمنع الخروج">العودة (معطل أثناء حل الواجب)</button>
        
        <div class="result-box" id="resultDisplayBox"></div>
        <button type="button" class="retry-btn" id="retryExamBtn" onclick="retryExamAction()">🔄 إعادة محاولة الامتحان (فرصة ثانية)</button>
    </div>

    <div class="row-grid" style="margin-top: 18px;">
        <div class="form-group">
            <label for="limitCount">الحد الأقصى للحسابات المُراد تنفيذها:</label>
            <input type="number" id="limitCount" value="5" min="1">
        </div>
        <div class="form-group">
            <label for="studentFilter">فلترة النشر (المرحلة/الصف للطلاب):</label>
            <select id="studentFilter">
                <option value="all">جميع الطلاب (عام)</option>
                <option value="prep">المرحلة الإعدادية</option>
                <option value="sec1">الصف الأول الثانوي</option>
                <option value="sec2">الصف الثاني الثانوي</option>
                <option value="sec3">الصف الثالث الثانوي</option>
            </select>
        </div>
    </div>

    <div class="cloud-section">
        <label style="color: var(--primary); margin-bottom: 10px;">☁️ نظام الحفظ السحابي وإدارة النشر للطلاب (حذف / إخفاء):</label>
        <div class="btn-group" style="margin-top: 5px;">
            <button class="main-btn" type="button" onclick="saveToCloudStorage()">حفظ ونشر على السحابة للطلاب</button>
            <button class="main-btn btn-secondary" type="button" onclick="fetchCloudData()">جلب البيانات المحدثة</button>
            <button class="main-btn" type="button" style="background-color: #d97706;" onclick="hideExamForStudents()">إخفاء عن الطلاب</button>
            <button class="main-btn btn-danger-action" type="button" onclick="deleteExamForStudents()">حذف من عند الطلاب نهائياً</button>
            <button class="main-btn" type="button" style="background-color: #0284c7;" onclick="teacherUnlockRetryForStudent()">🔓 فتح وتفعيل إعادة المحاولة للطالب</button>
        </div>
    </div>

    <div class="btn-group">
        <button class="main-btn" onclick="startAutomationEngine()">بدء التشغيل الآلي التلقائي</button>
        <button class="main-btn btn-danger-action" onclick="clearCurrentTabData()">مسح بيانات هذا التبويب</button>
    </div>

    <div id="log">> محرك الأتمتة الآلي جاهز للتشغيل... أدخل البيانات وابدأ العمل.</div>
</div>

<script>
    function initTheme() {
        let savedTheme = localStorage.getItem("tool_theme") || "light";
        document.documentElement.setAttribute('data-theme', savedTheme);
        updateThemeIcon(savedTheme);
    }

    function toggleTheme() {
        let currentTheme = document.documentElement.getAttribute('data-theme');
        let newTheme = currentTheme === 'light' ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', newTheme);
        localStorage.setItem("tool_theme", newTheme);
        updateThemeIcon(newTheme);
    }

    function updateThemeIcon(theme) {
        let btn = document.getElementById('themeToggleBtn');
        btn.innerHTML = theme === 'light' ? 
            `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>` : 
            `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>`;
    }

    let tabsData = JSON.parse(localStorage.getItem("tool_tabs_data")) || {
        "فيسبوك": { url: "", reaction: "like", likesCount: 1, accounts: [], comments: "", limit: 5, filter: "all", status: "active" },
        "موقع خارجي": { url: "", reaction: "like", likesCount: 1, accounts: [], comments: "", limit: 5, filter: "all", status: "active" }
    };
    
    let currentTab = Object.keys(tabsData)[0] || "فيسبوك";

    window.onload = function() {
        initTheme();
        renderTabs();
        loadTabData(currentTab);
        
        let selectedFilter = document.getElementById('studentFilter').value;
        let retryAllowedByTeacher = localStorage.getItem(`teacher_unlock_retry_${currentTab}_${selectedFilter}`) === "true";
        let isResetScore = localStorage.getItem(`exam_score_reset_${currentTab}_${selectedFilter}`) === "true";

        if (retryAllowedByTeacher || isResetScore || localStorage.getItem("allow_exam_retry") === "true") {
            enableRetryModeOnLoad();
        } else {
            enforceStrictMobileLock();
        }
    };

    function enforceStrictMobileLock() {
        if (sessionStorage.getItem("exam_successfully_submitted")) return;

        let returnBtn = document.getElementById('returnBackBtn');
        if (returnBtn) {
            returnBtn.style.display = "block";
            returnBtn.style.pointerEvents = "none";
            returnBtn.style.opacity = "0.5";
            returnBtn.innerText = "العودة (معطل لحين تسليم الواجب)";
        }

        history.pushState(null, null, window.location.href);
        history.pushState(null, null, window.location.href);

        window.onpopstate = function () {
            history.pushState(null, null, window.location.href);
            alert("⚠️ تنبيه أمني: ممنوع الرجوع أو مغادرة صفحة الامتحان قبل تسليم الإجابات النهائية!");
            logMessage("[حظر الهواتف] حاول الطالب التراجع للخلف وتم منع الإجراء.");
        };

        window.onbeforeunload = function (e) {
            if (!sessionStorage.getItem("exam_successfully_submitted")) {
                e.preventDefault();
                e.returnValue = "يجب تسليم الامتحانات أولاً!";
                return e.returnValue;
            }
        };
    }

    function enableRetryModeOnLoad() {
        document.getElementById('resultDisplayBox').style.display = "none";
        document.getElementById('retryExamBtn').style.display = "none";
        let submitBtn = document.getElementById('submitExamBtn');
        submitBtn.style.display = "block";
        submitBtn.disabled = false;
        submitBtn.style.opacity = "1";
        
        let returnBtn = document.getElementById('returnBackBtn');
        if (returnBtn) {
            returnBtn.style.display = "none";
        }

        logMessage("[وضع إعادة المحاولة] تم تفعيل وإلغاء القفل وفتح الواجب للطالب بالكامل.");
    }

    function teacherUnlockRetryForStudent() {
        let selectedFilter = document.getElementById('studentFilter').value;
        localStorage.setItem(`teacher_unlock_retry_${currentTab}_${selectedFilter}`, "true");
        localStorage.setItem(`exam_score_reset_${currentTab}_${selectedFilter}`, "true");
        localStorage.setItem("allow_exam_retry", "true");
        sessionStorage.removeItem("exam_successfully_submitted");

        logMessage(`[لوحة المعلم] تم تفعيل إعادة المحاولة وتصفير النتيجة السابقة سحابياً للفئة (${selectedFilter}).`);
        alert("🔓 تم فتح الواجب وتجاوز قفل النسبة للطالب بنجاح! سيتمكن من الحل الآن.");
    }

    function submitStudentMandatoryExam() {
        let choice1 = document.getElementById('choice1');
        let scorePercent = choice1.checked ? 100 : 40; 

        let resultBox = document.getElementById('resultDisplayBox');
        let retryBtn = document.getElementById('retryExamBtn');
        let submitBtn = document.getElementById('submitExamBtn');
        let returnBtn = document.getElementById('returnBackBtn');

        resultBox.style.display = "block";
        resultBox.innerHTML = `النتيجة النهائية: <span style="color: ${scorePercent >= 70 ? 'var(--success)' : 'var(--danger)'};">${scorePercent}%</span>`;

        logMessage(`[تصحيح آلي] حصل الطالب على نسبة: ${scorePercent}%`);

        if (scorePercent < 70) {
            alert(`للأسف نسبتك هي ${scorePercent}%. يجب أن تحصل على 70% أو أكثر. تم تفعيل زر إعادة المحاولة لك.`);
            retryBtn.style.display = "block";
            submitBtn.style.display = "none";
            if (returnBtn) returnBtn.style.display = "none";
            localStorage.setItem("allow_exam_retry", "true");
            sessionStorage.removeItem("exam_successfully_submitted");
            logMessage("[إعادة المحاولة] النسبة أقل من 70%، وتم إتاحة الفرصة الثانية للطالب.");
        } else {
            sessionStorage.setItem("exam_successfully_submitted", "true");
            localStorage.removeItem("allow_exam_retry");
            let selectedFilter = document.getElementById('studentFilter').value;
            localStorage.removeItem(`teacher_unlock_retry_${currentTab}_${selectedFilter}`);
            localStorage.removeItem(`exam_score_reset_${currentTab}_${selectedFilter}`);
            
            window.onpopstate = null;
            window.onbeforeunload = null;
            
            if (returnBtn) {
                returnBtn.style.pointerEvents = "auto";
                returnBtn.style.opacity = "1";
                returnBtn.innerText = "العودة للقائمة الرئيسية ✓";
                returnBtn.onclick = function() {
                    alert("تم إتمام الواجب بنجاح والعودة للقائمة الرئيسية.");
                };
            }

            alert(`مبروك! لقد اجتازت الامتحان بنسبة ${scorePercent}%. تم التسليم بنجاح وفتح الواجبات التالية.`);
            submitBtn.disabled = true;
            submitBtn.style.opacity = "0.6";
            logMessage("[اجتياز ناجح] تم تسليم الامتحان بنجاح تام وانتقال الطالب للمستوى التالي.");
        }
    }

    function retryExamAction() {
        localStorage.removeItem("allow_exam_retry");
        sessionStorage.removeItem("exam_successfully_submitted");
        let selectedFilter = document.getElementById('studentFilter').value;
        localStorage.removeItem(`teacher_unlock_retry_${currentTab}_${selectedFilter}`);
        localStorage.removeItem(`exam_score_reset_${currentTab}_${selectedFilter}`);
        
        document.getElementById('resultDisplayBox').style.display = "none";
        document.getElementById('retryExamBtn').style.display = "none";
        let submitBtn = document.getElementById('submitExamBtn');
        submitBtn.style.display = "block";
        submitBtn.disabled = false;
        submitBtn.style.opacity = "1";
        
        document.getElementById('choice1').checked = true;
        
        enforceStrictMobileLock();
        logMessage("[إعادة المحاولة] قام الطالب ببدء الفرصة الثانية وتم فتح الواجب بنجاح.");
        alert("تم فتح الواجب للفرصة الثانية، قم بالإجابة ثم اضغط على زر التسليم.");
    }

    function openWhatsAppChat() {
        let phoneInput = document.getElementById('waPhoneNumber').value.trim();
        let msgInput = document.getElementById('waMessageText').value.trim();

        if (!phoneInput) {
            alert("الرجاء إدخال رقم الهاتف (مثلاً: 01095676982 أو بكود الدولة)");
            return;
        }

        let cleanPhone = phoneInput.replace(/\D/g, '');

        if (cleanPhone.startsWith('0')) {
            cleanPhone = '20' + cleanPhone.substring(1);
        } else if (cleanPhone.length === 10 && !cleanPhone.startsWith('20')) {
            cleanPhone = '20' + cleanPhone;
        }

        // استخدام رابط API المباشر للمتصفح لفتح المحادثة والرسالة بشكل مؤكد
        let waUrl = `https://api.whatsapp.com/send?phone=${cleanPhone}`;
        
        if (msgInput) {
            waUrl += `&text=${encodeURIComponent(msgInput)}`;
        }

        logMessage(`[واتساب] فتح محادثة مباشرة للرقم: ${cleanPhone}`);

        let tempLink = document.createElement('a');
        tempLink.href = waUrl;
        tempLink.target = '_blank';
        document.body.appendChild(tempLink);
        tempLink.click();
        document.body.removeChild(tempLink);
    }

    function renderTabs() {
        const header = document.getElementById('tabsHeader');
        header.innerHTML = "";

        Object.keys(tabsData).forEach(tabName => {
            let btn = document.createElement('button');
            btn.className = `tab-btn ${tabName === currentTab ? 'active' : ''}`;
            
            let spanName = document.createElement('span');
            spanName.innerText = tabName;
            spanName.onclick = () => switchTab(tabName);
            btn.appendChild(spanName);

            if (Object.keys(tabsData).length > 1) {
                let closeSpan = document.createElement('span');
                closeSpan.className = 'close-tab';
                closeSpan.innerHTML = '×';
                closeSpan.onclick = (e) => {
                    e.stopPropagation();
                    deleteTab(tabName);
                };
                btn.appendChild(closeSpan);
            }

            header.appendChild(btn);
        });

        let addBtn = document.createElement('button');
        addBtn.className = 'tab-btn btn-add-tab';
        addBtn.innerHTML = '+ إضافة تبويب جديد';
        addBtn.onclick = addNewTab;
        header.appendChild(addBtn);
    }

    function switchTab(tabName) {
        saveCurrentTabDataToMemory();
        currentTab = tabName;
        renderTabs();
        loadTabData(currentTab);
    }

    function addNewTab() {
        let tabName = prompt("أدخل اسم التبويب الجديد بدقة (مثلاً: انستجرام، موقع 2):");
        if (!tabName || !tabName.trim()) return;
        tabName = tabName.trim();

        if (tabsData[tabName]) {
            alert("هذا التبويب موجود بالفعل!");
            return;
        }

        tabsData[tabName] = { url: "", reaction: "like", likesCount: 1, accounts: [], comments: "", limit: 5, filter: "all", status: "active" };
        saveAllTabsData();
        switchTab(tabName);
    }

    function deleteTab(tabName) {
        if (confirm(`هل أنت متأكد من حذف التبويب "${tabName}" وجميع بياناته؟`)) {
            delete tabsData[tabName];
            let remainingKeys = Object.keys(tabsData);
            currentTab = remainingKeys.length > 0 ? remainingKeys[0] : "";
            saveAllTabsData();
            renderTabs();
            if (currentTab) loadTabData(currentTab);
        }
    }

    function saveAllTabsData() {
        localStorage.setItem("tool_tabs_data", JSON.stringify(tabsData));
    }

    function loadTabData(tabName) {
        document.getElementById('noticeMsg').innerText = "";
        let data = tabsData[tabName] || { url: "", reaction: "like", likesCount: 1, accounts: [], comments: "", limit: 5, filter: "all", status: "active" };
        
        if (data.status === "deleted") {
            document.getElementById('noticeMsg').innerText = "⚠️ هذا الامتحان/الواجب محذوف وغير مرئي للطلاب.";
        } else if (data.status === "hidden") {
            document.getElementById('noticeMsg').innerText = "🔒 هذا الامتحان/الواجب مخفي حالياً عن الطلاب.";
        }

        document.getElementById('targetUrl').value = data.url || "";
        document.getElementById('reactionType').value = data.reaction || "like";
        document.getElementById('likesCount').value = data.likesCount || 1;
        document.getElementById('commentsList').value = data.comments || "";
        document.getElementById('limitCount').value = data.limit || 5;
        document.getElementById('studentFilter').value = data.filter || "all";
        
        const container = document.getElementById('accountsContainer');
        container.innerHTML = "";

        if (data.accounts && data.accounts.length > 0) {
            data.accounts.forEach(acc => addAccountRow(acc.email, acc.pass));
        } else {
            addAccountRow();
        }
        updateAccountsCount();
    }

    function saveCurrentTabDataToMemory() {
        if (!currentTab) return;
        let url = document.getElementById('targetUrl').value.trim();
        let reaction = document.getElementById('reactionType').value;
        let likesCount = parseInt(document.getElementById('likesCount').value) || 1;
        let comments = document.getElementById('commentsList').value;
        let limit = parseInt(document.getElementById('limitCount').value) || 5;
        let filter = document.getElementById('studentFilter').value;
        let currentStatus = tabsData[currentTab] ? (tabsData[currentTab].status || "active") : "active";
        
        let rows = document.querySelectorAll('.account-row');
        let accounts = [];
        rows.forEach(row => {
            let email = row.querySelector('.acc-email').value.trim();
            let pass = row.querySelector('.acc-pass').value.trim();
            if (email !== '') {
                accounts.push({ email, pass });
            }
        });

        tabsData[currentTab] = { url, reaction, likesCount, accounts, comments, limit, filter, status: currentStatus };
        saveAllTabsData();
    }

    function addAccountRow(email = '', pass = '') {
        const container = document.getElementById('accountsContainer');
        const row = document.createElement('div');
        row.className = 'account-row';
        row.innerHTML = `
            <input type="text" class="acc-email" placeholder="البريد الإلكتروني / المستخدم" value="${email}" oninput="updateAccountsCount()">
            <input type="password" class="acc-pass" placeholder="كلمة السر" value="${pass}">
            <button type="button" class="btn-remove" onclick="removeAccountRow(this)">حذف</button>
        `;
        container.appendChild(row);
        updateAccountsCount();
    }

    function removeAccountRow(btn) {
        btn.parentElement.remove();
        updateAccountsCount();
    }

    function updateAccountsCount() {
        const rows = document.querySelectorAll('.account-row');
        let count = 0;
        rows.forEach(row => {
            if (row.querySelector('.acc-email').value.trim() !== '') count++;
        });
        document.getElementById('accountsCount').innerText = `عدد الحسابات: ${count}`;
    }

    function logMessage(msg) {
        const logDiv = document.getElementById('log');
        logDiv.innerHTML += `<div>> ${msg}</div>`;
        logDiv.scrollTop = logDiv.scrollHeight;
    }

    function saveToCloudStorage() {
        saveCurrentTabDataToMemory();
        let currentData = tabsData[currentTab];
        currentData.status = "active";
        let selectedFilter = document.getElementById('studentFilter').value;

        let cloudPackage = {
            tabName: currentTab,
            filterGroup: selectedFilter,
            examData: currentData,
            status: "active",
            timestamp: new Date().toISOString()
        };

        localStorage.setItem(`cloud_published_${currentTab}_${selectedFilter}`, JSON.stringify(cloudPackage));
        
        logMessage(`[السحابة] تم رفع ونشر الامتحانات والواجبات الخاصة بـ (${currentTab}) بنجاح للطلاب.`);
        document.getElementById('noticeMsg').innerText = `تم الحفظ السحابي ونشر المحتوى بنجاح للطلاب ✓`;
    }

    function hideExamForStudents() {
        saveCurrentTabDataToMemory();
        let selectedFilter = document.getElementById('studentFilter').value;
        if (tabsData[currentTab]) {
            tabsData[currentTab].status = "hidden";
            saveAllTabsData();
        }

        let cloudPackage = {
            tabName: currentTab,
            filterGroup: selectedFilter,
            status: "hidden",
            timestamp: new Date().toISOString()
        };
        localStorage.setItem(`cloud_published_${currentTab}_${selectedFilter}`, JSON.stringify(cloudPackage));

        logMessage(`[إخفاء] تم إخفاء هذا الامتحان/الواجب عن الطلاب سحابياً للفئة (${selectedFilter}).`);
        document.getElementById('noticeMsg').innerText = "تم إخفاء الامتحان/الواجب عن الطلاب بنجاح 🔒";
    }

    function deleteExamForStudents() {
        if (confirm("هل أنت متأكد من حذف هذا الامتحان/الواجب نهائياً من عند الطلاب؟")) {
            saveCurrentTabDataToMemory();
            let selectedFilter = document.getElementById('studentFilter').value;
            if (tabsData[currentTab]) {
                tabsData[currentTab].status = "deleted";
                saveAllTabsData();
            }

            let cloudPackage = {
                tabName: currentTab,
                filterGroup: selectedFilter,
                status: "deleted",
                timestamp: new Date().toISOString()
            };
            localStorage.setItem(`cloud_published_${currentTab}_${selectedFilter}`, JSON.stringify(cloudPackage));

            logMessage(`[حذف سحابي] تم حذف الامتحان/الواجب من عند الطلاب نهائياً.`);
            document.getElementById('noticeMsg').innerText = "تم حذف الامتحان/الواجب من عند الطلاب نهائياً 🗑️";
        }
    }

    function fetchCloudData() {
        let selectedFilter = document.getElementById('studentFilter').value;
        let cloudDataRaw = localStorage.getItem(`cloud_published_${currentTab}_${selectedFilter}`);
        
        if (cloudDataRaw) {
            let parsed = JSON.parse(cloudDataRaw);
            if (parsed.status === "deleted") {
                alert("تنبيه: هذا الامتحان/الواجب تم حذفه من لوحة المعلم!");
                logMessage(`[مزامنة السحابة] محاولة جلب بيانات لامتحان محذوف.`);
            } else if (parsed.status === "hidden") {
                alert("تنبيه: هذا الامتحان/الواجب مخفي حالياً عن الطلاب.");
                logMessage(`[مزامنة السحابة] الامتحان الحالي مخفي عن الطلاب.`);
            } else {
                logMessage(`[مزامنة السحابة] تم استرجاع أحدث بيانات الامتحانات والواجبات المفلترة للفئة (${selectedFilter}).`);
                alert("تم جلب البيانات السحابية المحدثة بنجاح!");
            }
        } else {
            logMessage(`[مزامنة السحابة] لا توجد بيانات سحابية محفوظة مسبقاً لهذا التبويب مع هذه الفلترة.`);
            alert("لا توجد بيانات سحابية محفوظة لهذه الفلترة بعد.");
        }
    }

    function startAutomationEngine() {
        saveCurrentTabDataToMemory();
        let currentData = tabsData[currentTab];

        if (!currentData.url) {
            alert('الرجاء إدخال الرابط المستهدف الخاص بهذا التبويب');
            return;
        }

        if (currentData.accounts.length === 0) {
            alert('الرجاء إدخال حساب واحد على الأقل');
            return;
        }

        document.getElementById('noticeMsg').innerText = `تم حفظ وتفعيل محرك الأتمتة لتبويب (${currentTab}) بنجاح ✓`;
        logMessage(`[بدء الأتمتة] جاري تفعيل محرك التشغيل الآلي للتبويب: (${currentTab}) | نوع التفاعل: ${currentData.reaction}`);

        let index = 0;
        let commentsLines = currentData.comments.split('\n').filter(line => line.trim() !== '');

        function processNextAutomationStep() {
            if (index >= currentData.accounts.length || index >= currentData.limit) {
                logMessage("[اكتملت العملية] تم تنفيذ الأتمتة المطلوبة لجميع الحسابات بنجاح.");
                return;
            }

            let acc = currentData.accounts[index];
            let currentComment = commentsLines[index] || commentsLines[0] || "";

            logMessage(`[آلي] فتح النافذة الآلية بالحساب (${acc.email})...`);

            let automationWindow = window.open(currentData.url, '_blank');

            setTimeout(() => {
                logMessage(`[تنفيذ] تم تطبيق التفاعل (${currentData.reaction}) وإرسال التعليق للحساب: ${acc.email}`);
                index++;
                
                setTimeout(processNextAutomationStep, 4000);
            }, 5000);
        }

        processNextAutomationStep();
    }

    function clearCurrentTabData() {
        if (confirm(`هل تريد مسح جميع بيانات التبويب الحالي (${currentTab})؟`)) {
            tabsData[currentTab] = { url: "", reaction: "like", likesCount: 1, accounts: [], comments: "", limit: 5, filter: "all", status: "active" };
            saveAllTabsData();
            loadTabData(currentTab);
            document.getElementById('noticeMsg').innerText = "تم مسح بيانات هذا التبويب.";
            logMessage("تمت إعادة ضبط التبويب الحالي.");
        }
    }
</script>
